# Written by go tool tifa deploy setup. Delete this line before you edit the file: setup then leaves it alone.
name: tifa-deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: What to do on the server
        type: choice
        options: [deploy, rollback]
        default: deploy

# One deploy at a time. A deploy that runs is never cancelled.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install cloudflared
        run: |
          curl -fsSL -o "$RUNNER_TEMP/cloudflared.deb" https://github.com/cloudflare/cloudflared/releases/download/2026.11.1/cloudflared-linux-amd64.deb
          echo '744ce90be92adb361103d51c85f78646314c47e4a68bbaadfe12ab5acc16c9b6  '"$RUNNER_TEMP/cloudflared.deb" | sha256sum -c -
          sudo dpkg -i "$RUNNER_TEMP/cloudflared.deb"
      - name: Set up ssh
        env:
          TIFA_DEPLOY_SSH_KEY: ${{ secrets.TIFA_DEPLOY_SSH_KEY }}
          TIFA_DEPLOY_KNOWN_HOSTS: ${{ secrets.TIFA_DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$TIFA_DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$TIFA_DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<'EOF'
          Host *
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ProxyCommand cloudflared access ssh --hostname %h
          EOF
      - name: Deploy
        env:
          ACTION: ${{ inputs.action }}
          TIFA_DEPLOY_HOST: ${{ secrets.TIFA_DEPLOY_HOST }}
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.TIFA_DEPLOY_CF_ACCESS_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.TIFA_DEPLOY_CF_ACCESS_SECRET }}
        run: |
          if [ "$ACTION" = rollback ]; then
            go tool tifa deploy rollback --host "$TIFA_DEPLOY_HOST"
          else
            go tool tifa deploy --host "$TIFA_DEPLOY_HOST"
          fi
